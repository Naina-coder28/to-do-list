<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List | Task 3</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="todo-container">

        <h1>My To-Do List</h1>

        <form id="todo-form"> 

            <label for="todo-input">Add a new task</label>

            <div class="input-group">
                <input
                    type="text"
                    id="todo-input"
                    placeholder="Enter your task..."
                    autocomplete="off"
                >

                <button type="submit">Add Task</button>
            </div>

        </form>


        <div class="filters" aria-label="Task filters">

            <button type="button" class="filter-btn active" data-filter="all">
                All
            </button>

            <button type="button" class="filter-btn" data-filter="active">
                Active
            </button>

            <button type="button" class="filter-btn" data-filter="completed">
                Completed
            </button>

        </div>


        <section aria-labelledby="task-heading">

            <h2 id="task-heading">Tasks</h2>

            <ul id="task-list">
                <!-- JavaScript will add tasks here -->
            </ul>

            <p id="empty-message">No tasks yet. Add your first task!</p>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
